version: "v0.4"

project:
  name: "QuadraticFloorII: fibre sums and quartic traces at conductor 8lp"
  description: >-
    Sequel to QuadraticFloor. For an odd prime p, the alternating floor sums
    S_{A,B,C}(p) = sum over 0 <= n < p of (-1)^floor((A n^2 + B n + C)/p) with admissible (B, C) are
    averages of first Bernoulli numbers of the odd characters vartheta_{p,psi} = eta_p chi_{-4}^delta psi
    modulo 8Ap. The development proves that, weighted by psi_0(b)^2 and summed over the units b modulo
    A, these sums give minus the sum of B_{1,vartheta_{p,psi}} over the fibre psi^2 = psi_0^2, which is
    real when psi_0^4 = 1; that for a prime l = 1 (mod 4) and a quartic character xi modulo l the real
    part of B_{1,Theta_{l,p}}, Theta_{l,p} = vartheta_{p,xi}, and the Bernoulli number of
    eta_p (./l) are signed combinations of floor sums (the case l = 13 included); the Euler-factor
    relation B_{1,f 1_{l does not divide}}^{(ml)} = (1 - f(l)) B_{1,f}^{(m)} and the class-number shapes of
    the coefficients three and five; the quarter-range formula
    B_{1,vartheta_{p,psi}}^{(8Ap)} = -sum_{0<x<=2Ap} vartheta_{p,psi}(x); an elementary proof that both
    coordinates of B_{1,Theta_{l,p}} are even integers; and the half-range triangular sum
    2 sum_{n=1}^{(p-1)/2} (-1)^floor(n(n+1)/p) = S_{1,1,0}(p) - 2 + (-2/p).
  authors:
    - "Joseph S. Farland"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Joseph S. Farland"

