status:
  scope: >-
    Formalized: the results listed under alignment. Not formalized: Dirichlet's formula
    B_{1,chi_D} = -h(D), which turns the Bernoulli forms into class numbers; the primitivity, order and
    conductor of Theta_{l,p}; the quartic field K_p, its class number and the formula for
    |Im B_{1,Theta_p}| (Proposition 4.7, Corollary 4.8 apart from parity); the non-elimination results of
    Section 6, which rest on class numbers near 1.3e7 and large determinants; the sextic cases of
    Remark 5.2.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: ["Claude (Anthropic)"]
      framework: "Claude.ai with code execution"
      tool_setup: >-
        AI-assisted: the Lean code was drafted and repaired by Claude against the manuscripts'
        statements and proofs, compiled locally with lake, and the export of Solution was checked with
        the Lean kernel, nanoda and con-ron.
      cost:
        wall_time: "about one day"
        spend_usd: "subscription-based"
        hardware: "API-only plus local machine"
      prompting_notes: "The model was given the manuscripts' statements and proofs and asked to formalize them without sorry or native_decide."
  spend_usd: "subscription-based"
  notes: >-
    The author chose the scope: the floor-sum results of the manuscript left out of QuadraticFloor that
    need neither class field theory nor large class-number computations, and the half-range formula of
    Paper III.

fidelity:
  divergences: >-
    All statements are in Bernoulli form, with chi_{-8lp} = eta_p (./l), chi_{-24p} = eta_p chi_{-4} (./3)
    and chi_{-40p} = eta_p (./5) written as functions. Corollary 3.5 is stated as a sum over all residues b
    (the weight psi_0(b)^2 vanishes off the units) with admissible lifts B_b = b mod A, instead of a sum over
    square-class representatives with the factor 2^(-omega(A)); for prime l the representative form is
    proved within Theorem 5.1, where the representatives (B_s, C_s) are arbitrary functions on ZMod l
    constrained on sqClasses l, the squares of nonzero residues. The quartic character is any
    DirichletCharacter C l of order 4, and Theta_{l,p} is vartheta p xi, which carries chi_{-4} exactly
    when xi(-1) = -1, i.e. l = 5 (mod 8). The Euler factor is proved for every function of period m with
    vanishing period sum and every l >= 1, Corollary 3.6 under psi_0^4 = 1 alone, the quarter-range
    formula for every character modulo every odd A, and the evenness of both coordinates without the
    hypothesis p != l (so quartic_trace_even includes p = 5). The quadratic part of Theorem 5.1 is stated
    without a character among its hypotheses; its proof chooses a quartic character. Not formalized
    from Corollaries 3.5 and 3.6: the converse (the fibre sums determine the individual floor sums) and
    the remark that the fibre contains no real character. The parity part of Corollary 4.8 is proved from the quarter-range formula and the
    symmetry x -> 2lp - x instead of the class number formula for K_p. In Corollary 4.5 (24) the
    Legendre symbol (p/5) is written jacobiSym p 5.

review:
  status: "self-assessed"
  reviewers:
    - "Joseph S. Farland"
  notes: >-
    The definitions in Challenge.lean are copied verbatim from the development and compared by
    Comparator. The statements and the companion paper were checked by an independent AI review, and
    check/statements.py recomputes every statement numerically. No external referee has reviewed the
    manuscripts or the formalization.

alignment:
  namespace: "QuadraticFloorII"
  statements:
    - source: "Equation (12), the Euler factor, for any function of period m with vanishing period sum"
      lean: "QuadraticFloorII.euler_factor"
      module: "Challenge"
      status: "proved"
    - source: "Equation (12) for eta_p, every l >= 1"
      lean: "QuadraticFloorII.euler_factor_eta"
      module: "Challenge"
      status: "proved"
    - source: "Theorem 4.2 in class-number shape (Bernoulli form)"
      lean: "QuadraticFloorII.floorSum_three_class"
      module: "Challenge"
      status: "proved"
    - source: "Corollary 4.3 (Bernoulli form)"
      lean: "QuadraticFloorII.class_twentyfour"
      module: "Challenge"
      status: "proved"
    - source: "Corollary 4.5, equation (24) (Bernoulli form)"
      lean: "QuadraticFloorII.class_forty"
      module: "Challenge"
      status: "proved"
    - source: "Corollary 3.5, summed over units"
      lean: "QuadraticFloorII.fibre_sum"
      module: "Challenge"
      status: "proved"
    - source: "Corollary 3.6"
      lean: "QuadraticFloorII.fibre_sum_real"
      module: "Challenge"
      status: "proved"
    - source: "Existence of a quartic character modulo a prime l = 1 (mod 4) (hypothesis of Theorem 5.1)"
      lean: "QuadraticFloorII.quartic_exists"
      module: "Challenge"
      status: "proved"
    - source: "Proof of Theorem 5.1: xi^2 = (./l), the fibres {xi, xi^-1} and {1, xi^2}"
      lean: "QuadraticFloorII.quartic_fibres"
      module: "Challenge"
      status: "proved"
    - source: "Theorem 5.1, first identity (the quartic trace)"
      lean: "QuadraticFloorII.conductor_trace"
      module: "Challenge"
      status: "proved"
    - source: "Theorem 5.1, second identity (Bernoulli form)"
      lean: "QuadraticFloorII.conductor_quadratic"
      module: "Challenge"
      status: "proved"
    - source: "Display after Theorem 5.1, l = 13"
      lean: "QuadraticFloorII.conductor_thirteen"
      module: "Challenge"
      status: "proved"
    - source: "Quarter-range formula B_{1,vartheta} = -sum_{0<x<=2Ap} vartheta(x) (used for Corollary 4.8)"
      lean: "QuadraticFloorII.quarter_range"
      module: "Challenge"
      status: "proved"
    - source: "Corollary 4.8, parity of both coordinates, for every prime l = 1 (mod 4)"
      lean: "QuadraticFloorII.conductor_even"
      module: "Challenge"
      status: "proved"
    - source: "Corollary 4.8, parity of both coordinates of B_{1,Theta_p}"
      lean: "QuadraticFloorII.quartic_trace_even"
      module: "Challenge"
      status: "proved"
    - source: "Paper III, Theorem 4.4 (second formula), Bernoulli form"
      lean: "QuadraticFloorII.half_range_triangular"
      module: "Challenge"
      status: "proved"

